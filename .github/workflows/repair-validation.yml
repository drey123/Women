name: repair-validation

on:
  push:
    branches:
      - "fix/**"
    paths-ignore:
      - "reports/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "reports/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/actionlint-url
          import json, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/rhysd/actionlint/releases/latest",
              headers={"Accept": "application/vnd.github+json", "User-Agent": "Women-CI-Repair"}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)
          assets = [a["browser_download_url"] for a in release["assets"]
                    if a["name"].endswith("_linux_amd64.tar.gz")]
          if not assets:
              raise SystemExit("No Linux amd64 actionlint release asset found")
          print(assets[0])
          PY
          curl --fail --show-error --silent --location "$(cat /tmp/actionlint-url)" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          chmod +x /tmp/actionlint
      - name: Lint GitHub Actions workflow
        run: /tmp/actionlint -color .github/workflows/static-analysis.yml
      - name: Check shell syntax
        run: |
          bash -n tooling/setup_tools.sh
          bash -n tooling/download_apk.sh
          bash -n tooling/analyze_static.sh
      - name: Check app matrix
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/static-analysis.yml")
            packages = workflow.fetch("jobs").fetch("static").fetch("strategy").fetch("matrix").fetch("pkg")
            abort "Expected 14 app packages, found #{packages.length}" unless packages.length == 14
            abort "Duplicate app package IDs found" unless packages.uniq.length == packages.length
            abort "Invalid package ID in matrix" unless packages.all? { |pkg| pkg.match?(/\A[A-Za-z0-9_.]+\z/) }
            puts "Validated #{packages.length} unique app package IDs"
          '
