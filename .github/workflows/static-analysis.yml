name: static-analysis

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "fix/**"
    paths-ignore:
      - "reports/**"
      - "note.md"
      - "spec/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "reports/**"
      - "note.md"
      - "spec/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            tooling
          sparse-checkout-cone-mode: true
      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/static-analysis.yml"); puts "Workflow YAML parses"'
      - name: Validate shell syntax
        run: |
          bash -n tooling/setup_tools.sh
          bash -n tooling/download_apk.sh
          bash -n tooling/analyze_static.sh
      - name: Validate analysis matrix size
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/static-analysis.yml")
            packages = workflow.fetch("jobs").fetch("static").fetch("strategy").fetch("matrix").fetch("pkg")
            abort "Expected 14 app packages, found #{packages.length}" unless packages.length == 14
            abort "Duplicate app package IDs found" unless packages.uniq.length == packages.length
            abort "Invalid package ID in matrix" unless packages.all? { |pkg| pkg.match?(/\A[A-Za-z0-9_.]+\z/) }
            puts "Validated #{packages.length} unique app packages"
          '

  exodus-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            tooling
          sparse-checkout-cone-mode: true
      - name: Pull live Exodus tracker inventories
        shell: bash
        env:
          EXODUS_API_TOKEN: ${{ secrets.EXODUS_API_TOKEN }}
        run: |
          timeout 300 python3 tooling/exodus_api.py
      - name: Upload Exodus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exodus-report
          path: reports/exodus/
          if-no-files-found: warn
          retention-days: 14

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pkg:
          - org.iggymedia.periodtracker
          - com.clue.android
          - com.period.tracker.lite
          - com.glow.android
          - com.glow.android.eve
          - com.ovuline.fertility
          - in.plackal.lovecyclesfree
          - com.popularapp.periodcalendar
          - com.stardust.app
          - com.naturalcycles.cordova
          - premom.eh.com.ehpremomapp
          - com.tamtris.fertilityfriend
          - com.hp.pregnancy.lite
          - com.babycenter.pregnancytracker
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            tooling
          sparse-checkout-cone-mode: true
      - name: Set app label and isolate this matrix result
        id: app
        run: |
          APP=$(echo "${{ matrix.pkg }}" | tr '.' '_')
          echo "label=$APP" >> "$GITHUB_OUTPUT"
          rm -rf reports/static
          mkdir -p "reports/static/$APP"
      - name: Install toolchain
        id: tools
        run: bash tooling/setup_tools.sh
      - name: Download APK
        id: download
        continue-on-error: true
        run: bash tooling/download_apk.sh "${{ matrix.pkg }}" /tmp/apk
      - name: Static analysis
        id: analysis
        if: steps.tools.outcome == 'success' && steps.download.outcome == 'success'
        run: |
          chmod +x tooling/analyze_static.sh
          bash tooling/analyze_static.sh "${{ steps.app.outputs.label }}" "${{ matrix.pkg }}" "/tmp/apk/${{ matrix.pkg }}.apk" reports/static
      - name: Record unavailable or skipped analysis
        if: always()
        env:
          APP_LABEL: ${{ steps.app.outputs.label }}
          PACKAGE_NAME: ${{ matrix.pkg }}
          TOOL_OUTCOME: ${{ steps.tools.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        run: |
          mkdir -p "reports/static/$APP_LABEL"
          if [ "$TOOL_OUTCOME" != "success" ] || [ "$DOWNLOAD_OUTCOME" != "success" ] || [ ! -s "/tmp/apk/$PACKAGE_NAME.apk" ]; then
            RESULT="NOT ANALYSED"
            REASON="required toolchain or APK acquisition was unavailable; no valid analysis result can be claimed."
          elif [ "$ANALYSIS_OUTCOME" != "success" ]; then
            RESULT="ANALYSIS FAILED"
            REASON="analysis command failed after acquisition; the partial output is not a completed assessment."
          else
            exit 0
          fi
          # shellcheck disable=SC2016
          # Backticks below are literal Markdown delimiters, not shell substitutions.
          printf '# Analysis status: %s\n\n- Package: `%s`\n- Result: %s\n- Toolchain step: `%s`\n- APK download step: `%s`\n- Analysis step: `%s`\n- Reason: %s\n- Interpretation: an unavailable or failed analysis is not evidence that the app is safe or unsafe.\n' \
            "$APP_LABEL" "$PACKAGE_NAME" "$RESULT" "$TOOL_OUTCOME" "$DOWNLOAD_OUTCOME" "$ANALYSIS_OUTCOME" "$REASON" \
            > "reports/static/$APP_LABEL/STATUS.md"
          cp "reports/static/$APP_LABEL/STATUS.md" "reports/static/$APP_LABEL/report.md"
      - name: Upload per-app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.pkg }}
          path: reports/static/
          if-no-files-found: warn
          retention-days: 14

  publish-reports:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [exodus-api, static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /reports/exodus/
            /reports/static/*/report.md
            /reports/static/*/STATUS.md
            /reports/static/*/exodus_scan.tsv
            /reports/static/*/evidence/
          sparse-checkout-cone-mode: false
      - name: Download per-app evidence
        uses: actions/download-artifact@v4
        with:
          pattern: static-*
          path: reports/static
          merge-multiple: true
      - name: Download Exodus evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: exodus-report
          path: reports/exodus
      - name: Commit aggregated reports once
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          # Existing dec/src trees are retained research material and must not be pruned.
          # Stage only artifacts this publisher manages; broad "git add -A reports/" is
          # unsafe with sparse checkout because omitted paths can look absent.
          git add --sparse -- reports/exodus/exodus_live.json reports/exodus/exodus_live.md
          find reports/static -type f \( -name report.md -o -name STATUS.md -o -name exodus_scan.tsv \) -print0 | xargs -0 -r git add --sparse --
          find reports/static -type f -path '*/evidence/*' -print0 | xargs -0 -r git add --sparse --
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Update static-analysis evidence [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish reports after three attempts."
          exit 1
