name: static-analysis

on:
  push:
    branches: [main]
    paths-ignore:
      - "reports/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  exodus-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull live Exodus tracker inventories
        run: python3 tooling/exodus_api.py
      - name: Commit reports
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add reports/ && git commit -m "exodus live inventory [skip ci]" || echo "nothing to commit"
          git push

  static:
    needs: exodus-api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - org.iggymedia.periodtracker   # Flo
          - com.clue.android              # Clue
          - com.period.tracker.lite       # Period Tracker (Simple Design)
          - com.glow.android              # Glow
          - com.glow.android.eve          # Eve
          - com.ovuline.fertility         # Ovia Fertility
          - in.plackal.lovecyclesfree     # Maya
          - com.popularapp.periodcalendar # Period Calendar
          - com.stardust.app              # Stardust
          - com.naturalcycles.cordova     # Natural Cycles
          - premom.eh.com.ehpremomapp     # Premom
          - com.tamtris.fertilityfriend   # Fertility Friend
          - com.hp.pregnancy.lite         # Pregnancy+
          - com.babycenter.pregnancytracker # BabyCenter
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (self-provisioned)
        run: bash tooling/setup_tools.sh
      - name: Download APK (${{ matrix.pkg }})
        run: bash tooling/download_apk.sh "${{ matrix.pkg }}" /tmp/apk
      - name: Static analysis (${{ matrix.pkg }})
        run: |
          chmod +x tooling/analyze_static.sh
          APP=$(echo "${{ matrix.pkg }}" | tr '.' '_')
          bash tooling/analyze_static.sh "$APP" "${{ matrix.pkg }}" "/tmp/apk/${{ matrix.pkg }}.apk" reports/static
      - name: Commit report
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add reports/static || true
          git commit -m "static analysis ${{ matrix.pkg }} [skip ci]" || echo "nothing to commit"
          git pull --rebase || true
          git push
