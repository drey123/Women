<meta http-equiv="content-type" content="text/html;charset=UTF-8"/>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"/>
    <!-- Biometrics placeholder -->
    <script src="file:///android_asset/childgrowthchart/BabyCenterBiometrics.js" type="text/javascript"></script>
    <!-- Chart library placeholder -->
    <script src="file:///android_asset/childgrowthchart/Chart.js" type="text/javascript"></script>
    <!-- CDC data placeholder -->
    <script src="file:///android_asset/childgrowthchart/CDCData.js" type="text/javascript"></script>
    <!-- jQuery placeholder -->
    <script src="file:///android_asset/jquery.js" type="text/javascript"></script>
    <!-- User input placeholder -->
    <script type="text/javascript">%UserInput%</script>

    <style type="text/css">
        * {
                -webkit-touch-callout: none;
                -webkit-user-select: none; /* Disable selection/copy in UIWebView */
        }

        .container, #tooltipContainer {
                font-family: Arial;
                border: 1px solid #34a5b5;
                border-radius: 5px;
                display: inline-block;
                float: right;
                position: absolute;
                background-color: white;
                display: flex;
        }

        .container > div:first-child, #tooltipContainer > div:first-child {
            padding: 5px;
            background-color: #34a5b5;
            float: left;
            display: inline-block;
        }

        .container > div:first-child span:first-child, #tooltipContainer > div:first-child span:first-child {
            font-size: 40px;
            color: #fff;
            font-weight: bold;
            line-height: 60px;
        }

        .container > div:first-child span:last-child, #tooltipContainer > div:first-child span:last-child {
            color: #fff;
            font-size: 15px;
        }

        .container > div:last-child, #tooltipContainer  > div:last-child {
            padding: 10px;
            float: left;
            display: inline-block;
        }

        .container > div:last-child p, #tooltipContainer > div:last-child p {
            color: #444;
            margin-bottom: 0px;
            margin-top: 0px;
            font-size: 15px;
            line-height: 18px;
        }

        .container > div:last-child p:first-child, #tooltipContainer > div:last-child p:first-child {
            margin-top:0;
        }

        .container > div:last-child p:last-child, #tooltipContainer > div:last-child p:last-child {
            margin-bottom: 0;
        }

        .container > div:last-child p span, #tooltipContainer > div:last-child p span {
            float: right;
            color: #aaa;
            padding: 6px;
            border: 1px solid #aaa;
            border-radius: 50%%;
            margin-left: 28px;
        }

        * {
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }

        .yAxisLabel {
            top: -5px;
            left: 0;
            position: relative;
            font-size: 12px;
            color: #999;
        }

        .xAxisLabel {
            float: right;
            top: -8px;
            right: 5px;
            position: relative;
            font-size: 12px;
            color: #999;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #012126;
            }

            .yAxisLabel {
                color: #E0E0E0;
            }

            .xAxisLabel {
                color: #E0E0E0;
            }

            .container > div:last-child p, #tooltipContainer > div:last-child p {
                color: #A0A0A0 !important;
            }
        }
    </style>
</head>

<body>
<div id="wrapper" style="position: absolute; height: 92%; width: 98%">
    <div id="yAxisLabel" class="yAxisLabel"></div>
    <canvas id="childGrowthChart"></canvas>
    <div class="xAxisLabel">Age (months)</div>
</div>

<div class="container">
    <div>
        <span id="percentile"></span><span id="ordinal"></span>
    </div>
    <div>
        <p id="biometricReading"><span></span></p>
        <p id="readingDate"></p>
        <p id="monthsOld"></p>
    </div>
</div>

<script src="file:///android_asset/childgrowthchart/RunDetailChart.js" type="text/javascript"></script>

</body>
</html>
