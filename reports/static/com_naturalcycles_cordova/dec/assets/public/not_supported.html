<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width"
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Natural Cycles</title>

    <style>
      body {
        font-family: Sans-Serif;
      }

      .fixed-width-container {
        width: 350px;
        position: absolute;
        top: 45%;
        left: 50%;
        -webkit-transform: translate(-50%, -50%);
        -moz-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        -o-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        overflow: hidden;
      }

      .logo-container {
        height: 32px;
        width: 32px;
        margin: 0 auto;
      }

      .outdated-line {
        text-align: center;
        color: #72035d;
        font-size: 30px;
        margin-bottom: 20px;
      }

      .outdated-url-container {
        font-size: 18px;
        text-align: center;
      }

      .outdated-url {
        color: #63a4f8;
      }

      .download-line {
        text-align: center;
        margin-bottom: 30px;
        font-size: 18px;
        line-height: 1.5;
        color: #a3a3a3;
      }

      .store-img-container {
        float: left;
        width: 50%;
        height: auto;
      }

      .img-apple {
        padding-right: 5px;
        max-width: 100%;
        max-height: 100%;
      }

      .img-google {
        padding-left: 5px;
        max-width: 100%;
        max-height: 100%;
      }

      @media (max-width: 400px) {
        .fixed-width-container {
          width: 300px;
        }

        .outdated-line {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <div class="fixed-width-container">
      <div class="logo-container">
        <img class="logo-image" src="favicon.png" alt="Natural Cycles" />
      </div>

      <div>
        <p class="outdated-line">We do not support your browser version</p>
      </div>

      <div class="outdated-url-container">
        <a class="outdated-url" href="http://outdatedbrowser.com/en"
          >Download a new one for free!</a
        >
      </div>

      <div>
        <p class="download-line">
          You can also download our app from <br />
          the App Store or Google Play.
        </p>
      </div>

      <a
        class="store-img-container"
        href="https://itunes.apple.com/app/naturalcycles/id765535549?ls=1&mt=8"
      >
        <img class="img-apple" src="/assets/img/badges/apple.png" alt="Natural Cycles App Store" />
      </a>

      <a
        class="store-img-container"
        href="https://play.google.com/store/apps/details?id=com.naturalcycles.cordova&hl=en"
      >
        <img
          class="img-google"
          src="/assets/img/badges/google.png"
          alt="Natural Cycles Google Play"
        />
      </a>
    </div>
  </body>
</html>
